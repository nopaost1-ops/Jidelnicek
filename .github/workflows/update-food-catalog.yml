name: Update Czech food catalog
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-food-catalog
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Czech snapshot with progress
        env:
          MAX_PRODUCTS: '20000'
          MAX_UNCOMPRESSED_CHUNK: '6291456'
          LOG_EVERY: '100000'
          USER_AGENT: 'JidelnicekPlus-CatalogBuilder/1.1 (GitHub Actions)'
        run: node build-cz-catalog.mjs
      - name: Commit catalog snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-manifest.json
          find . -maxdepth 1 -type f -name 'catalog-chunk-*.json.gz' -print0 | xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo "No catalog changes"
          else
            git commit -m "Update Czech food catalog snapshot"
            git push
          fi

